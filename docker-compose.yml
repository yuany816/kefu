name: merchant-ai

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_DB: merchant_ai
      POSTGRES_USER: merchant_ai
      POSTGRES_PASSWORD: merchant_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchant_ai -d merchant_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

